[package]
name = "cmbook"
version = "0.1.0"
description = "A Tauri App"
authors = ["codexu"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
tauri-utils = "2"

[dependencies]
tauri = { version = "2", features = [ "macos-private-api", "protocol-asset", "image-png", "tray-icon" ] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "=1"
tauri-plugin-store = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-http = { version = "=2.3.0", features = ["unsafe-headers"] }
tauri-plugin-os = "2"
tauri-plugin-single-instance = "2"
fuzzy-matcher = "0.3.7"
rayon = "1.8.0"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.12", features = ["json", "multipart", "stream", "rustls-tls"] }
futures-util = "0.3"
# 阿里云百炼实时语音识别 WebSocket 通道（qwen3-asr-flash-realtime）
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
base64 = "0.22"
url = "2.5"
tauri-plugin-opener = "2.4.0"
uuid = { version = "1.10", features = ["v4"] }
zip = { version = "4", default-features = false, features = ["deflate"] }
tauri-plugin-keyring = "0.1.0"
# 系统通知（待办到期提醒 B2-7）
tauri-plugin-notification = "2"

[dependencies.tauri-plugin-sql]
features = ["sqlite"]
version = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
tauri-plugin-clipboard = "2"
xcap = "=0.6.0"
tauri-plugin-process = "=2.0.0"
jieba-rs = { version = "0.7", features = ["textrank"] }
machine-uid = "0.5"
regex = "1"
font-kit = "0.14"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_System_Threading"
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.23"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies.tauri]
version = "2"
features = []
